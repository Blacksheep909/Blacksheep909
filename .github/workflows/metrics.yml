name: Generate GitHub Metrics

on:
  schedule:
    - cron: "0 18 * * *"   # ~6-7am NZ time daily
  workflow_dispatch:
  push:
    branches: ["main"]

concurrency:
  group: github-metrics
  cancel-in-progress: true

jobs:
  build:
    # don't re-trigger on the bot's own commit
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Uses a personal token if you add one as the METRICS_TOKEN secret (fuller stats),
          # otherwise falls back to the built-in token.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Blacksheep909
          filename: github-metrics.svg
          committer_message: "Update github-metrics.svg [skip ci]"
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Pacific/Auckland
          config_order: base.header, base.activity, base.community, base.repositories, languages, base.metadata

          plugin_languages: yes
          plugin_languages_ignored: html, css, xml, json, txt, procfile
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_details: percentage
